name: Сборка и тесты

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle (кэш)
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        run: ./gradlew build --console=plain

      - name: Сборка (jar)
        uses: actions/upload-artifact@v4
        with:
          name: hybridauth-jar
          path: build/libs/*.jar
          if-no-files-found: error
